# qa environment
base.url=https://parabank.parasoft.com/parabank
api.base.url=https://parabank.parasoft.com/parabank/services/bank
browser=chrome
headless=true

# API tests register their own customer when these are empty, because the public
# demo resets its data (the old john/demo login no longer exists).
# To use an existing customer: -Dapi.username=... -Dapi.password=...
api.username=
api.password=

# In-memory DB in Oracle compatibility mode
db.url=jdbc:h2:mem:bankdb;MODE=Oracle;DB_CLOSE_DELAY=-1
db.user=sa
db.pass=
