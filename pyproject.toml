[project]
name = "banking-chatbot-eval"
version = "0.1.0"
description = "Evaluation framework for a RAG banking FAQ assistant: correctness, hallucination, prompt injection and personal-data leakage."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
app = ["policies/*.md"]
evals = ["dataset/*.yaml", "fixtures/*.yaml", "thresholds.yaml"]
