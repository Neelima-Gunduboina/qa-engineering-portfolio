[project]
name = "ai-qa-toolkit"
version = "0.1.0"
description = "AI tools for QA: test case generation, an MCP server for test execution, and a defect investigation agent with human approval."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_qa_toolkit = ["defect_agent/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
