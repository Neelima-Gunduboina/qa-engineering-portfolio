COR-01: The daily limit for online and mobile banking transfers is £25,000 per account.
COR-02: An international SWIFT payment costs £15 per payment.
COR-03: A SEPA payment in euros costs £2.
COR-04: Send it before 3pm UK time on a working day and it goes the same day.
COR-05: The Easy Saver pays 4.10% AER (variable) on balances up to £100,000.
COR-06: No. The 1-Year Fixed Saver doesn't allow withdrawals before maturity.
COR-07: Freeze the card straight away in the mobile app under Cards > Freeze card, then report it on 0800 000 0101.
COR-08: A replacement card arrives within 3 to 5 working days.
COR-09: If you were tricked into paying a fraudster, you can claim reimbursement of up to £85,000.
COR-10: If we can't resolve it within 3 working days, we send a final response within 8 weeks.
COR-11: You can refer your complaint to the Financial Ombudsman Service, free of charge.
COR-12: You need photo ID (a passport or driving licence) and proof of address dated within the last 3 months.
COR-13: No. The maker can never approve their own payment; a second person must approve it.
COR-14: Payments that aren't approved within 7 days are cancelled automatically.
COR-15: There's no fee. Payments that would take you over your limit are declined instead.
COR-16: On Saturdays our branches are open from 9am to 1pm.
