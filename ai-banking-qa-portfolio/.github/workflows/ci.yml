name: Playwright CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: https://parabank.parasoft.com
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: TypeScript type-check (fast gate)
  # ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  # ─────────────────────────────────────────────
  # Job 2: Sharded Playwright test run
  # ─────────────────────────────────────────────
  test:
    name: Playwright Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: typecheck

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          BASE_URL: ${{ env.BASE_URL }}
          # LLM key — set as repository secret to enable GenAI features
          # If absent, self-heal/triage degrade gracefully; tests still run
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

      - name: Upload test results (screenshots, diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-shard-${{ matrix.shard }}
          path: test-results/**/*.zip
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Merge reports + AI triage
  # ─────────────────────────────────────────────
  report:
    name: Merge Reports & AI Triage
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-shard-*
          merge-multiple: true
          path: all-blob-reports/

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
        env:
          # The json reporter writes here so the triage step can read it
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Run AI failure triage
        if: always()
        run: npm run triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        # Triage is non-blocking — a triage failure doesn't fail CI
        continue-on-error: true

      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-report
          path: test-results/triage.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 4: API-only quick check (no browser)
  # ─────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (API context only)
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npx playwright test tests/api --project=api
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          retention-days: 7
