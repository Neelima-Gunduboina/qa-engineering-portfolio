name: neelima-my-learning

on:
  push:
    branches: [main]
    paths: ["neelima-my-learning/**", ".github/workflows/neelima-my-learning.yml"]
  pull_request:
    branches: [main]
    paths: ["neelima-my-learning/**", ".github/workflows/neelima-my-learning.yml"]
  workflow_dispatch:

jobs:
  java-basics:
    name: Java Basics (JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neelima-my-learning/java-basics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test

  selenium-testng-practice:
    name: Selenium TestNG Practice (headless Chrome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neelima-my-learning/selenium-testng-practice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test
      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: neelima-my-learning/selenium-testng-practice/target/surefire-reports
